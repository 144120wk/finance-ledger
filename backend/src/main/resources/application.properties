spring.application.name=ledger-backend
server.port=8080

# ---------------- Default profile: H2 in-memory (zero-install dev) ----------------
spring.datasource.url=jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------- JWT ----------------
# Override both in production via environment variables (see README).
ledger.jwt.secret=${JWT_SECRET:change-me-in-production-please-use-a-random-secret-of-at-least-32-bytes}
ledger.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
