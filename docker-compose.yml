services:
  mysql:
    image: mysql:8.4
    container_name: ledger-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ledger
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: ledger-backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ledger
      DB_USER: root
      DB_PASSWORD: root
      # IMPORTANT: replace with a strong random secret in production.
      JWT_SECRET: change-me-in-production-use-a-long-random-secret
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ledger-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
